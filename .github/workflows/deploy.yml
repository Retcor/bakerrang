name: Deploy MAIN

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy deliberately to MAIN/live
        required: true
        type: choice
        options:
          - api
          - portal
          - renderer
          - client

permissions:
  contents: read

jobs:
  changes:
    name: Classify push changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_api: ${{ steps.classify.outputs.deploy_api }}
      deploy_portal: ${{ steps.classify.outputs.deploy_portal }}
      deploy_renderer: ${{ steps.classify.outputs.deploy_renderer }}
      deploy_client: ${{ steps.classify.outputs.deploy_client }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test deployment policy
        run: node --test scripts/ci/classify-changes.test.mjs scripts/ci/deployment-workflows.test.mjs

      - name: Validate push ancestry and collect changed files
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "The push before SHA is empty or all zeros; refusing to classify an invalid range." >&2
            exit 1
          fi
          git cat-file -e "${BEFORE}^{commit}"
          git cat-file -e "${AFTER}^{commit}"
          if ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo "$BEFORE is not an ancestor of $AFTER; refusing to classify non-linear history." >&2
            exit 1
          fi
          git diff --name-only --diff-filter=ACDMRTUXB -z "$BEFORE..$AFTER" > "$RUNNER_TEMP/changed-files.z"

      - name: Classify changed files
        id: classify
        run: node scripts/ci/classify-changes.mjs --input "$RUNNER_TEMP/changed-files.z" --github-output "$GITHUB_OUTPUT"

  validate-api:
    name: Validate API
    needs: changes
    if: needs.changes.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  validate-platform:
    name: Validate Platform
    needs: changes
    if: needs.changes.outputs.deploy_portal == 'true' || needs.changes.outputs.deploy_renderer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  validate-client:
    name: Validate Client
    needs: changes
    if: needs.changes.outputs.deploy_client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy-api:
    name: Deploy API
    needs: [changes, validate-api]
    if: always() && github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.deploy_api == 'true' && needs.validate-api.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service: api
      environment: production
      image_tag: git-${{ github.sha }}
      smoke_via_service_url: true

  deploy-portal:
    name: Deploy Portal
    needs: [changes, validate-platform]
    if: always() && github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.deploy_portal == 'true' && needs.validate-platform.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service: portal
      environment: production
      image_tag: git-${{ github.sha }}
      smoke_via_service_url: true

  deploy-renderer:
    name: Deploy Renderer
    needs: [changes, validate-platform]
    if: always() && github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.deploy_renderer == 'true' && needs.validate-platform.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service: renderer
      environment: production
      image_tag: git-${{ github.sha }}
      smoke_via_service_url: true

  deploy-client:
    name: Deploy Client
    needs: [changes, validate-client]
    if: always() && github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.deploy_client == 'true' && needs.validate-client.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service: client
      environment: production
      image_tag: git-${{ github.sha }}
      smoke_via_service_url: true

  guard-main:
    name: Require main branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-main dispatches
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Live deployments must be dispatched from refs/heads/main; received $DISPATCH_REF." >&2
            exit 1
          fi

  deploy-selected-service:
    name: Deploy selected service
    if: github.event_name == 'workflow_dispatch'
    needs: guard-main
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yml
    with:
      service: ${{ inputs.service }}
      environment: production
      image_tag: git-${{ github.sha }}
      smoke_via_service_url: true

  live-deploy-passed:
    name: live-deploy-passed
    if: always()
    needs:
      - changes
      - validate-api
      - validate-platform
      - validate-client
      - deploy-api
      - deploy-portal
      - deploy-renderer
      - deploy-client
      - guard-main
      - deploy-selected-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify MAIN deployment result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOY_API: ${{ needs.changes.outputs.deploy_api }}
          DEPLOY_PORTAL: ${{ needs.changes.outputs.deploy_portal }}
          DEPLOY_RENDERER: ${{ needs.changes.outputs.deploy_renderer }}
          DEPLOY_CLIENT: ${{ needs.changes.outputs.deploy_client }}
          VALIDATE_API_RESULT: ${{ needs.validate-api.result }}
          VALIDATE_PLATFORM_RESULT: ${{ needs.validate-platform.result }}
          VALIDATE_CLIENT_RESULT: ${{ needs.validate-client.result }}
          API_RESULT: ${{ needs.deploy-api.result }}
          PORTAL_RESULT: ${{ needs.deploy-portal.result }}
          RENDERER_RESULT: ${{ needs.deploy-renderer.result }}
          CLIENT_RESULT: ${{ needs.deploy-client.result }}
          GUARD_RESULT: ${{ needs.guard-main.result }}
          SELECTED_RESULT: ${{ needs.deploy-selected-service.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GUARD_RESULT" != "success" ]]; then
              echo "Main-branch guard did not succeed: $GUARD_RESULT" >&2
              exit 1
            fi
            if [[ "$SELECTED_RESULT" != "success" ]]; then
              echo "Selected live deployment did not succeed: $SELECTED_RESULT" >&2
              exit 1
            fi
            echo "Selected MAIN/live deployment passed."
            exit 0
          fi

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "Unsupported deployment event: $EVENT_NAME" >&2
            exit 1
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Push classification failed or did not complete: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPLOY_API" == "true" && ( "$VALIDATE_API_RESULT" != "success" || "$API_RESULT" != "success" ) ]]; then
            echo "Affected API validation/deployment did not succeed: validation=$VALIDATE_API_RESULT deployment=$API_RESULT" >&2
            exit 1
          fi
          if [[ ( "$DEPLOY_PORTAL" == "true" || "$DEPLOY_RENDERER" == "true" ) && "$VALIDATE_PLATFORM_RESULT" != "success" ]]; then
            echo "Affected Platform validation did not succeed: $VALIDATE_PLATFORM_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPLOY_PORTAL" == "true" && "$PORTAL_RESULT" != "success" ]]; then
            echo "Affected Portal deployment did not succeed: $PORTAL_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPLOY_RENDERER" == "true" && "$RENDERER_RESULT" != "success" ]]; then
            echo "Affected Renderer deployment did not succeed: $RENDERER_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPLOY_CLIENT" == "true" && ( "$VALIDATE_CLIENT_RESULT" != "success" || "$CLIENT_RESULT" != "success" ) ]]; then
            echo "Affected Client validation/deployment did not succeed: validation=$VALIDATE_CLIENT_RESULT deployment=$CLIENT_RESULT" >&2
            exit 1
          fi
          echo "All affected MAIN/live validations and deployments passed."
