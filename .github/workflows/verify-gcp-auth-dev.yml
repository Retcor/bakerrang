name: Verify DEV GCP authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-auth:
    name: Verify DEV Workload Identity Federation
    runs-on: ubuntu-latest
    environment: development
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This authentication check must be run from the main branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify authenticated identity and DEV Cloud Run access
        shell: bash
        run: |
          echo "Active account: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Configured project: $(gcloud config get-value project)"
          service_name="$(gcloud run services describe bakerrang-api-dev \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(metadata.name)')"
          echo "Cloud Run service: ${service_name}"
          test "${service_name}" = "bakerrang-api-dev"
