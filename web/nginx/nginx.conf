server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
