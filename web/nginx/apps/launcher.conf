# The Launcher also answers for the bare bakerrang.com apex (and www), which the
# retired legacy client used to serve. Those hosts only redirect: old paths go to
# the subdomain that now owns them, everything else to the Launcher itself.
map $request_uri $apex_redirect_target {
    default                    https://launch.bakerrang.com/;
    ~^/storybook(?:[/?#]|$)    https://storybook.bakerrang.com/;
    ~^/polyglot(?:[/?#]|$)     https://polyglot.bakerrang.com/;
    ~^/sign-language(?:[/?#]|$) https://sign.bakerrang.com/;
    ~^/budget(?:[/?#]|$)       https://budget.bakerrang.com/;
    ~^/passwords(?:[/?#]|$)    https://passwords.bakerrang.com/;
    ~^/account(?:[/?#]|$)      https://account.bakerrang.com/;
}

server {
    listen 8080;
    server_name bakerrang.com www.bakerrang.com;

    location / {
        return 301 $apex_redirect_target;
    }
}

server {
    listen 8080 default_server;
    server_name localhost;
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /vendor/ {
        types { application/wasm wasm; application/javascript js; application/octet-stream task; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
