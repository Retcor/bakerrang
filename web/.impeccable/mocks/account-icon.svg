<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Account app-icon master (design spec for the PWA icon set; rasterise to 512/192/180/32/16 at build,
    with an app-local scripts/generate-icons.cjs cloned from apps/passwords).
    - Tile: world charcoal #161514, full-bleed (maskable-safe: all artwork inside the central 80% circle,
      radius 204.8; the farthest point is the badge corner at ~198px from centre).
    - Mark: the shared Account emblem (the same paths as web-app-shell ProductEmblem 'account'),
      stroked in Account Grey #A5A59C (the existing accent-account token, dark value) at the emblem's
      1.75/32 weight scaled to the tile.
    - Signature: the Relay, three small ground tiles (light, dark, and a split system tile) on one baseline,
      in Ink #f2efe9 at 40% so the emblem leads.
    - Badge: the canonical BakerRang pixel-B, composited from bakerrang-logo.png (never redrawn;
      byte-identical to client/src/assets/bakerrang-logo.png), at the same position as the Budget and
      Passwords icons so the family reads as one kit.
    Provenance: authored for Phase H by the planner; no generated raster.
  -->
  <rect width="512" height="512" fill="#161514"/>
  <g transform="translate(118.4 62.4) scale(8.6)" fill="none" stroke="#A5A59C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="12" r="5"/>
    <path d="M6 26c1.8-4.4 5.6-6.5 10-6.5S24.2 21.6 26 26"/>
  </g>
  <g stroke="#f2efe9" stroke-opacity=".4" stroke-width="5" fill="none">
    <rect x="124" y="330" width="40" height="40" rx="5"/>
    <rect x="178" y="330" width="40" height="40" rx="5" fill="#f2efe9" fill-opacity=".4"/>
    <rect x="232" y="330" width="40" height="40" rx="5"/>
  </g>
  <path d="M234.5 367.5l35-35v32a5 5 0 0 1-5 5z" fill="#f2efe9" fill-opacity=".4"/>
  <image href="bakerrang-logo.png" xlink:href="bakerrang-logo.png" x="300" y="316" width="88" height="88"/>
</svg>
