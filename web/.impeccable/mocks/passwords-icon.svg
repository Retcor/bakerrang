<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Passwords app-icon master (design spec for the PWA icon set; rasterise to 512/192/180/32/16 at build,
    with an app-local scripts/generate-icons.cjs cloned from apps/budget).
    - Tile: world charcoal #161514, full-bleed (maskable-safe: all artwork inside the central 80% circle,
      radius 204.8; farthest point is the badge corner at ~198px from centre).
    - Mark: the shared Passwords emblem (the same paths as web-app-shell ProductEmblem 'passwords'),
      stroked in Passwords Slate #AEB8C2 (the existing accent-passwords token, dark value) at the emblem's
      1.75/32 weight scaled to the tile.
    - Signature: the fixed mask (four of the twelve bullets) over a part-drained 1px rule, the app's
      "Mask and Draining Rule", in Ink #f2efe9 at 40%.
    - Badge: the canonical BakerRang pixel-B, composited from bakerrang-logo.png (never redrawn;
      SHA-256 566F5419…0EA84A21, byte-identical to client/src/assets/bakerrang-logo.png), at the same
      position as the Budget icon so the family reads as one kit.
    Provenance: authored for Phase G by the planner; no generated raster.
  -->
  <rect width="512" height="512" fill="#161514"/>
  <g transform="translate(118.4 70.4) scale(8.6)" fill="none" stroke="#AEB8C2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="14" width="18" height="12" rx="2.5"/>
    <path d="M11 14v-3a5 5 0 0 1 10 0v3"/>
    <circle cx="16" cy="20" r="1.6"/>
  </g>
  <g fill="#f2efe9" fill-opacity=".4">
    <circle cx="150" cy="344" r="9"/>
    <circle cx="186" cy="344" r="9"/>
    <circle cx="222" cy="344" r="9"/>
    <circle cx="258" cy="344" r="9"/>
  </g>
  <path d="M141 378H236" stroke="#f2efe9" stroke-opacity=".4" stroke-width="6" stroke-linecap="square"/>
  <image href="bakerrang-logo.png" xlink:href="bakerrang-logo.png" x="300" y="316" width="88" height="88"/>
</svg>
