<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#161514" />
<title>Passwords — comp</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@700;800&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   Passwords comp — BakerRang consumer world, "Three panes, evolved".
   Folder rail | dense entry index + A–Z rail | entry sheet (View first).
   Gold (owner, 2026-09-27) = New entry, each sheet/dialog commit, switches, checked boxes and active states. Slate = emblem + selected-title underline only.
   Secrets: never rendered while hidden; revealed in the system monospace; the draining rule is the auto-hide timer.
   Every name, username, website and secret is synthetic.
   ========================================================= */
:root {
  color-scheme: dark;
  --gold: #ffd500; --gold-hover: #f0c400; --gold-press: #ddba00; --gold-text: #ffd500; --ink-on-gold: #1a1a1a;
  --bg: #161514; --bg-2: #1c1b1a; --plane: #201f1d; --plane-2: #262523;
  --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.18);
  --ink: #f2efe9; --ink-2: #c3bfb6; --ink-3: #928d83;
  --danger: #e88a8a;
  --pass: #aeb8c2;
  --h-created: #6fcf97; --h-edited: #f2a93b; --h-moved: #8ab4d8; --h-deleted: #e88a8a; --h-vault: #928d83;
  --shadow-resting: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --shadow-contact: 0 1px 2px rgba(0,0,0,.4);
  --r-inner: 3px; --r: 4px; --r-panel: 8px;
  --gut: clamp(16px, 2.4vw, 28px);
  --rail: 248px; --sheet: 440px;
  --sans: "Archivo", system-ui, "Noto Sans", "Segoe UI", sans-serif;
  --expanded: "Archivo Expanded", "Archivo", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --gold-text: #8a6300;
  --bg: #efece6; --bg-2: #e7e3db; --plane: #ffffff; --plane-2: #f6f4ef;
  --line: rgba(20,18,16,.12); --line-strong: rgba(20,18,16,.22);
  --ink: #1b1a18; --ink-2: #4f4b44; --ink-3: #6b665e;
  --danger: #c0362b;
  --pass: #4d5867;
  --h-created: #1e7a45; --h-edited: #8a4a00; --h-moved: #2f6690; --h-deleted: #c0362b; --h-vault: #6b665e;
  --shadow-resting: 0 1px 2px rgba(30,26,20,.10), 0 12px 28px rgba(30,26,20,.10);
  --shadow-contact: 0 1px 2px rgba(30,26,20,.10);
}
*,*::before,*::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: inherit; text-underline-offset: 4px; }
h1, h2, h3, p { margin: 0; }
::selection { background: var(--gold); color: var(--ink-on-gold); }
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 3px; border-radius: var(--r-inner); }
input, textarea { caret-color: var(--gold-text); }
* { scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
*::-webkit-scrollbar { width: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border: 3px solid transparent; background-clip: padding-box; border-radius: 20px; }
#live { position: fixed !important; top: 0; left: 0; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; }
.dots { fill: currentColor; stroke: none; }

/* ---------- world controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 40px; padding: 9px 15px; border-radius: var(--r); border: 1px solid transparent; font: 600 14px/1.2 var(--sans); cursor: pointer; background: transparent; transition: background .16s, border-color .16s, color .16s, transform .06s; white-space: nowrap; text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.btn--gold { background: var(--gold); color: var(--ink-on-gold); box-shadow: var(--shadow-contact); }
.btn--gold:hover { background: var(--gold-hover); } .btn--gold:active { background: var(--gold-press); }
.btn--ink { background: var(--ink); color: var(--bg); }
.btn--ink:hover { background: var(--ink-2); }
.btn--ghost { border-color: var(--line-strong); color: var(--ink); }
.btn--ghost:hover { background: var(--plane-2); }
.btn--quiet { color: var(--ink-2); padding-inline: 10px; }
.btn--quiet:hover { color: var(--ink); background: var(--plane-2); }
.btn--danger { color: var(--danger); padding-inline: 10px; }
.btn--danger:hover { background: var(--plane-2); }
.btn--sm { min-height: 34px; padding: 6px 11px; font-size: 13px; gap: 6px; }
.btn--wide { width: 100%; min-height: 48px; }
.ibtn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--r); border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; transition: background .16s, color .16s, border-color .16s; flex: none; }
.ibtn:hover { background: var(--plane-2); color: var(--ink); border-color: var(--line); }
.ibtn[aria-expanded="true"] { background: var(--plane-2); border-color: var(--line-strong); color: var(--ink); }
.avatar { width: 36px; height: 36px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--plane); color: var(--ink); font: 700 12px var(--sans); cursor: pointer; letter-spacing: .02em; }
.avatar:hover { border-color: var(--ink-3); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.tag { font: 700 10.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.label { font: 700 11px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.check { width: 20px; height: 20px; border-radius: var(--r-inner); border: 1.5px solid var(--ink-3); background: transparent; display: inline-grid; place-items: center; cursor: pointer; flex: none; padding: 0; color: var(--ink-on-gold); }
.check[aria-checked="true"], .check[aria-checked="mixed"] { background: var(--gold); border-color: var(--gold); }
:root[data-theme="light"] .check[aria-checked="true"], :root[data-theme="light"] .check[aria-checked="mixed"] { border-color: var(--gold-text); }
.check svg { width: 14px; height: 14px; stroke-width: 2.4; }
.checkhit { width: 36px; height: 36px; display: grid; place-items: center; margin: -8px; flex: none; }
.field { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--ink); font: 500 15px/1.35 var(--sans); outline: none; transition: border-color .16s, box-shadow .16s; }
.field::placeholder { color: var(--ink-3); font-weight: 400; }
.field:hover { border-color: var(--ink-3); }
.field:focus { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.field.masked { -webkit-text-security: disc; }
.field.mono { font-family: var(--mono); letter-spacing: .04em; }
.field[aria-invalid="true"] { box-shadow: inset 3px 0 0 var(--ink); }
textarea.field { min-height: 104px; resize: vertical; line-height: 1.5; }

/* ---------- bar ---------- */
.bar { position: sticky; top: 0; height: 58px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 40; }
.bar__in { height: 100%; padding: 0 var(--gut); display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; }
.brand__mark { width: 30px; height: 30px; display: block; }
.brand__rule { width: 1px; height: 22px; background: var(--line-strong); }
.brand__name { font: 800 15px/1 var(--expanded); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.bar__sp { flex: 1; }
.bar__right { display: flex; align-items: center; gap: 6px; }
.menu { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: var(--plane); border: 1px solid var(--line-strong); border-radius: var(--r-panel); box-shadow: var(--shadow-resting); padding: 6px; z-index: 60; display: none; }
.menu.is-open > .pop { display: block; animation: pop .16s var(--ease); }
.pop--left { right: auto; left: 0; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop__head { font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 6px; }
.pop__item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r); border: 0; background: none; color: var(--ink-2); font: 500 14px var(--sans); text-align: left; cursor: pointer; text-decoration: none; min-height: 40px; }
.pop__item:hover, .pop__item:focus-visible { background: var(--plane-2); color: var(--ink); }
.pop__danger, .pop__danger:hover { color: var(--danger); }
.pop__sep { height: 1px; background: var(--line); margin: 6px 4px; }
.switcher { width: 292px; }
.switcher__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
.switcher__cell { display: grid; justify-items: center; gap: 6px; padding: 12px 4px 10px; border-radius: var(--r); font: 600 11.5px var(--sans); color: var(--ink-2); text-decoration: none; }
.switcher__cell:hover { background: var(--plane-2); color: var(--ink); }
.switcher__cell svg { width: 26px; height: 26px; color: var(--acc); }
.switcher__cell.is-here { background: var(--plane-2); color: var(--ink); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: var(--r); background: var(--plane); }
.seg button { border: 0; background: none; padding: 6px 10px; border-radius: var(--r-inner); font: 600 12px var(--sans); color: var(--ink-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--plane-2); color: var(--ink); box-shadow: var(--shadow-contact); }

/* ---------- vault shell ---------- */
.app { height: calc(100dvh - 58px); min-height: 520px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.app > .tools { grid-row: 1; } .app > .notice { grid-row: 2; } .app > .panes { grid-row: 3; }
.t-group { display: contents; }
.tools { display: flex; align-items: center; gap: 4px; padding: 10px var(--gut); border-bottom: 1px solid var(--line); min-height: 60px; }
.tools .btn--gold { margin-right: 10px; }
.tools__sp { flex: 1; }
.tool-lbl { display: none; }
@media (min-width: 1280px) { .tool-lbl { display: inline; } }
.notice { display: flex; align-items: flex-start; gap: 12px; padding: 12px var(--gut); border-bottom: 1px solid var(--line-strong); color: var(--ink); font: 500 14px/1.45 var(--sans); }
.notice p + p, .notice small { color: var(--ink-3); font-weight: 400; display: block; }
.notice .btn { margin-left: auto; }
.notice svg.i { color: var(--ink-2); margin-top: 1px; }
.panes { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 0; }
.panes.has-sheet { grid-template-columns: var(--rail) minmax(0, 1fr) var(--sheet); }

/* folder rail */
.rail { background: var(--bg-2); border-right: 1px solid var(--line-strong); overflow-y: auto; padding: 16px 10px 24px; min-height: 0; }
.rail__group { padding: 28px 8px 12px; display: flex; align-items: center; gap: 10px; }
.rail__group:first-child { padding-top: 4px; }
.rail__group::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.rail__group + .rail__group, .rail__rule { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; }
.frow { display: flex; align-items: center; min-height: 36px; border-radius: var(--r); color: var(--ink-2); position: relative; }
.frow:hover { background: var(--plane); }
.frow.is-here { background: var(--plane); color: var(--ink); }
.frow__grip, .frow__chev, .frow__more { width: 22px; height: 30px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); cursor: pointer; flex: none; padding: 0; border-radius: var(--r-inner); }
.frow__grip { cursor: grab; opacity: 0; } .frow:hover .frow__grip, .frow__grip:focus-visible { opacity: 1; }
.frow__grip svg { width: 12px; height: 12px; }
.frow__chev svg { width: 14px; height: 14px; transition: transform .16s var(--ease); }
.frow__chev[aria-expanded="true"] svg { transform: rotate(90deg); }
.frow__more { width: 28px; opacity: .55; } .frow:hover .frow__more, .frow__more:focus-visible, .frow__more[aria-expanded="true"] { opacity: 1; }
.frow__more svg { width: 16px; height: 16px; }
.frow__name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 7px 4px; text-align: left; cursor: pointer; color: inherit; font: 500 14px/1.3 var(--sans); }
.frow__name span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow.is-here .frow__name { font-weight: 600; }
.frow__count { margin-left: auto; font: 500 12.5px var(--sans); color: var(--ink-3); font-variant-numeric: tabular-nums; padding-left: 6px; }
.frow__shared { color: var(--ink-3); display: inline-grid; } .frow__shared svg { width: 15px; height: 15px; }
.frow--top .frow__name { padding-left: 10px; }
.rail__add { margin: 6px 0 0 4px; }
.rail__viewonly { margin-left: 6px; }

/* index */
.index { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.index__head { padding: 18px var(--gut) 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.index__title { font: 800 1.3rem/1.15 var(--expanded); letter-spacing: -.025em; }
.index__count { color: var(--ink-3); font: 500 14px var(--sans); font-variant-numeric: tabular-nums; }
.index__scope { color: var(--ink-3); font: 500 14px var(--sans); }
.searchrow { display: flex; align-items: center; gap: 14px; padding: 0 var(--gut) 12px; }
.search { position: relative; flex: 1; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search .field { padding-left: 40px; padding-right: 40px; }
.search__clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; }
.search__key { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 11px var(--sans); color: var(--ink-3); border: 1px solid var(--line-strong); border-radius: var(--r-inner); padding: 1px 6px; pointer-events: none; }
.listwrap { flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--line-strong); }
.list { flex: 1; min-width: 0; overflow-y: auto; padding: 0 0 96px; margin: 0; list-style: none; }
.erow { display: grid; grid-template-columns: 36px minmax(0, auto) minmax(0, 1fr) auto; align-items: center; column-gap: 14px; min-height: 46px; padding: 0 12px 0 var(--gut); border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.erow:hover { background: var(--plane); }
.erow.is-open, .erow.is-checked { background: var(--plane); }
.erow__name { border: 0; background: none; padding: 12px 0; text-align: left; cursor: pointer; color: var(--ink); font: 500 15px/1.3 var(--sans); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.erow.is-open .erow__name { text-decoration: underline 1px var(--pass); text-underline-offset: 5px; }
.erow:hover .erow__name { text-decoration: underline 1px var(--pass); text-underline-offset: 5px; }
.erow__sub { color: var(--ink-3); font: 400 14px/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.erow__tag { padding-left: 8px; }
.letter { font: 700 11px/1 var(--sans); letter-spacing: .14em; color: var(--ink-3); padding: 16px 12px 8px var(--gut); border-bottom: 1px solid var(--line); list-style: none; }
.az { flex: none; width: 30px; display: flex; flex-direction: column; align-items: center; padding: 8px 0; overflow-y: auto; touch-action: none; user-select: none; border-left: 1px solid var(--line); }
.az button { width: 26px; height: 21px; border: 0; background: none; border-radius: var(--r-inner); font: 700 10.5px/1 var(--sans); color: var(--ink-3); cursor: pointer; padding: 0; }
.az button:hover { color: var(--ink); background: var(--plane-2); }
.az button.is-at { color: var(--gold-text); background: var(--plane-2); }
.empty { padding: 56px var(--gut); max-width: 560px; }
.empty h2 { font: 800 1.45rem/1.15 var(--expanded); letter-spacing: -.025em; margin-bottom: 10px; }
.empty p { color: var(--ink-2); margin-bottom: 20px; }
.empty .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.folderbar { display: none; }

/* bulk bar */
.bulk { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 45; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; background: var(--plane); border: 1px solid var(--line-strong); border-radius: var(--r-panel); box-shadow: var(--shadow-resting); width: min(620px, calc(100vw - 32px)); }
.bulk__n { font: 600 14px var(--sans); white-space: nowrap; margin-right: auto; }

/* sheet */
.sheet { background: var(--bg-2); border-left: 1px solid var(--line-strong); overflow-y: auto; min-height: 0; display: flex; flex-direction: column; animation: sheetIn .16s var(--ease); }
@keyframes sheetIn { from { opacity: 0; transform: translateX(4px); } }
.sheet__head { display: flex; align-items: flex-start; gap: 6px; padding: 16px 20px 14px 14px; border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; background: var(--bg-2); z-index: 2; }
.sheet__back .lbl { display: none; }
.sheet__title { flex: 1; min-width: 0; font: 800 1.32rem/1.2 var(--expanded); letter-spacing: -.025em; padding: 7px 4px 0; overflow-wrap: anywhere; }
.sheet__title:focus { outline: none; }
.sheet__body { padding: 4px 24px 24px; flex: 1; }
.sheet__notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 24px; border-bottom: 1px solid var(--line-strong); font: 500 14px/1.45 var(--sans); }
.sheet__notice small { display: block; color: var(--ink-3); font-weight: 400; }
.sheet__notice .acts { display: flex; gap: 8px; margin-top: 10px; }
.fld { padding: 14px 0; border-bottom: 1px solid var(--line); }
.fld__label { display: block; margin-bottom: 6px; }
.fld__row { display: flex; align-items: center; gap: 6px; min-height: 36px; }
.fld__val { flex: 1; min-width: 0; font: 500 16px/1.4 var(--sans); overflow-wrap: anywhere; }
.fld__val.plain { color: var(--ink-2); font-weight: 400; }
.fld__val a { text-decoration: underline 1px var(--line-strong); text-underline-offset: 4px; }
.fld__val a:hover { text-decoration-color: var(--pass); }
.fld__notes { white-space: pre-wrap; color: var(--ink-2); font: 400 15px/1.55 var(--sans); overflow-wrap: anywhere; }
.fld__tools { display: flex; gap: 2px; flex: none; }
.mask { font: 700 19px/1 var(--sans); letter-spacing: .12em; color: var(--ink-3); user-select: none; }
.secretwrap { display: inline-block; max-width: 100%; }
.secret { font: 500 16px/1.4 var(--mono); letter-spacing: .04em; color: var(--ink); overflow-wrap: anywhere; word-break: break-all; }
.drain { display: block; height: 1px; margin-top: 7px; background: var(--gold-text); transform-origin: left center; animation: drain var(--hide, 30s) linear forwards; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.hidehint { display: none; margin-top: 6px; font: 400 12.5px var(--sans); color: var(--ink-3); }
:root[data-motion="reduced"] .drain { display: none; } :root[data-motion="reduced"] .hidehint { display: block; }
@media (prefers-reduced-motion: reduce) { .drain { display: none; } .hidehint { display: block; } .sheet, .menu.is-open > .pop, .dlg { animation: none !important; } }
:root[data-motion="reduced"] .sheet, :root[data-motion="reduced"] .dlg { animation: none; }
.itool { position: relative; width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: var(--r); background: transparent; color: var(--ink-2); cursor: pointer; text-decoration: none; flex: none; padding: 0; transition: background .16s, color .16s, border-color .16s; }
.itool svg.i { width: 20px; height: 20px; }
.itool:hover { background: var(--plane-2); color: var(--gold-text); border-color: var(--line); }
.itool[aria-pressed="true"], .itool.is-done, .itool.is-done:hover { color: var(--gold-text); }
.itool--danger, .itool--danger:hover { color: var(--danger); }
.itool[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 4px 8px; background: var(--plane); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow-contact); font: 600 12px/1.2 var(--sans); letter-spacing: 0; color: var(--ink); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
.itool--below[data-tip]::after { bottom: auto; top: calc(100% + 6px); }
.itool--end[data-tip]::after { left: auto; right: 0; transform: none; }
.itool[data-tip]:hover::after, .itool[data-tip]:focus-visible::after, .itool.is-done[data-tip]::after { opacity: 1; }

const CLASSES = { lower: 'abcdefghijklmnopqrstuvwxyz', upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', digit: '0123456789', sym: '!#$%&*+-=?@^_~' }
const pick = (n) => { const lim = 2 ** 32 - (2 ** 32 % n); const b = new Uint32Array(1); for (;;) { crypto.getRandomValues(b); if (b[0] < lim) return b[0] % n } }
const generate = ({ len, sym }) => {
  const cls = [CLASSES.lower, CLASSES.upper, CLASSES.digit, ...(sym ? [CLASSES.sym] : [])]
  const all = cls.join('')
  for (;;) { let s = ''; for (let i = 0; i < len; i++) s += all[pick(all.length)]; if (cls.every((c) => [...s].some((ch) => c.includes(ch)))) return s }
}

const countIn = (fid) => own().filter((e) => e.folder === fid).length

const rail = () => {

}
const indexTitle = () => {

const folderbarLabel = () => { const sh = inShare(); if (sh) return sh.name; return S.folder === 'all' ? 'All entries' : S.folder === 'none' ? 'Unfiled' : folderPath(S.folder) }
const index = () => {
  if (S.gate === 'empty') return `<section class="index" aria-labelledby="emptyT"><div class="empty"><h2 id="emptyT">Your vault is empty.</h2><p>Add your first login, or bring your passwords over from KeePass. Everything is encrypted here before it's saved.</p><div class="acts"><button class="btn btn--gold" data-act="new">${ic('plus')}New entry</button><button class="btn btn--ghost" data-act="dlg" data-d="import">${ic('import')}Import from KeePass</button></div></div></section>`
  const list = visibleEntries()
  const sh = inShare()
  const canSelect = !sh || sh.perm === 'edit'
  const allChecked = list.length > 0 && list.every((e) => S.bulk.has(e.id))
  const someChecked = list.some((e) => S.bulk.has(e.id))
  const sub = (e) => (S.query.trim() ? (e.share ? shareOf(e.share).name : e.folder ? folderPath(e.folder) : 'Unfiled') : (e.user || (e.url || '').replace(/^https?:\/\//, '')))
  const letters = []; list.forEach((e) => { const l = letterOf(e.title); if (!letters.includes(l)) letters.push(l) })
  const showRail = list.length >= 20 && letters.length > 1
  let rows = ''
  if (!list.length) {
    rows = S.query.trim()
      ? `<li style="list-style:none" class="empty"><h2>No entries match “${esc(S.query.trim())}”.</h2><p>Search looks at titles, usernames and websites, not notes.</p><button class="btn btn--ghost" data-act="clearq">Clear search</button></li>`
      : `<li style="list-style:none" class="empty"><h2>Nothing in ${esc(folderbarLabel())} yet.</h2><p>New entries you add while this folder is open go here.</p></li>`
  } else {
    rows = list.map((e) => {

    <div class="index__head${S.query.trim() ? ' is-search' : ''}${sh ? ' is-shared' : ''}">${indexTitle()}</div>

      <div class="search">${ic('search')}<label for="q" class="sr">Search title, username or website</label><input class="field" id="q" data-f="q" type="search" placeholder="Search title, username, website" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.query)}" />${S.query ? `<button class="ibtn search__clear" aria-label="Clear search" data-act="clearq">${ic('x', 'sm')}</button>` : '<span class="search__key" aria-hidden="true">/</span>'}</div>

  </section>`

/* ---------- entry sheet ---------- */
const hostOf = (u) => { try { const x = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(u) ? u : 'https://' + u); return /^https?:$/.test(x.protocol) ? { href: x.href, host: x.host + (x.pathname === '/' ? '' : x.pathname) } : null } catch { return null } }

const sheet = () => {

  const canEdit = !sh || sh.perm === 'edit'
  const title = S.isNew ? 'New entry' : (unreadable.has(e.id) ? 'Can’t open this entry' : e.title)

const vault = () => {
  const hasSheet = !!(S.sel || S.isNew)
  return `${bar(true)}<main class="app">${toolbar()}${notices()}<div class="panes${hasSheet ? ' has-sheet' : ''}"><h1 class="sr">Passwords</h1>${rail()}${index()}${sheet()}</div></main>${bulkBar()}${dialogs()}`
}

/* ============ render (comp: string render; app: React, no remount of focused controls) ============ */
const render = () => {
  document.documentElement.dataset.theme = S.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : S.theme
  document.documentElement.dataset.motion = S.motion
  const a = document.activeElement
  const fk = a && a.dataset ? a.dataset.f : null
  const sel = fk && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null
  let html = ''
  if (S.gate === 'welcome') html = welcome()
  else if (S.gate === 'create') html = createView()
  else if (S.gate === 'unlock') html = unlockView()
  else if (S.gate === 'metafailed') html = metaFailed()
  else if (S.gate === 'notfound') html = notFound()
  else html = vault()
  document.getElementById('root').innerHTML = html
  // Secret-class fields are uncontrolled: assign the property, never an attribute.
  const npw = document.getElementById('npw'); if (npw) npw.value = S.draftPw
  const fN = document.getElementById('fN'); if (fN && S.draft) fN.value = S.draft.notes || ''
  const list = document.getElementById('list'); if (list) { const mark = () => { const top = list.getBoundingClientRect().top; const row = [...list.querySelectorAll('.erow')].find((r) => r.getBoundingClientRect().bottom > top + 4); const l = row && row.dataset.letter; document.querySelectorAll('.az button').forEach((b) => { const on = b.dataset.l === l; b.classList.toggle('is-at', on); if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current') }) }; list.addEventListener('scroll', mark, { passive: true }); mark() }
  if (fk) { const el = document.querySelector(`[data-f="${fk}"]`); if (el) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]) } catch {} } }
}

/* ============ behavior ============ */
const hide = (why) => { if (!S.revealed) return; S.revealed = false; clearTimeout(hideTimer); render(); if (why) announce('Password hidden') }
const openEntry = (id) => { hide(); S.sel = id; S.mode = 'view'; S.isNew = false; S.replace = false; S.copied = null; S.copyFail = false; S.sheetNotice = null; S.confirmDelete = false; S.folderPanel = false; render(); const h = document.getElementById('sheetT'); if (h) h.focus() }
const startEdit = () => { const e = byId(S.sel); hide(); S.mode = 'edit'; S.replace = false; S.draftPw = ''; S.draft = { title: e.title, user: e.user, url: e.url, folder: e.folder, notes: e.notes }; render(); document.getElementById('fT').focus() }
const jump = (l) => { const r = document.querySelector(`.erow[data-letter="${l}"]`); if (r) r.scrollIntoView({ block: 'start', behavior: S.motion === 'reduced' ? 'auto' : 'smooth' }) }

document.addEventListener('click', async (ev) => {
  if (ev.target.closest('.review')) return
  const m = ev.target.closest('[data-menu]')
  if (m) { S.menu = S.menu === m.dataset.menu ? null : m.dataset.menu; render(); return }
  const th = ev.target.closest('[data-theme-set]'); if (th) { S.theme = th.dataset.themeSet; render(); return }
  const t = ev.target.closest('[data-act]')
  if (!t) { if (S.menu) { S.menu = null; render() } return }
  const a = t.dataset.act
  if (a !== 'dlg-x-scrim' || ev.target === t) ev.preventDefault()
  if (S.menu && a !== 'dlg') S.menu = null
  if (a === 'signin') { S = { ...base(), theme: S.theme, motion: S.motion, hideSecs: S.hideSecs, gate: 'unlock' }; render() }
  else if (a === 'signout') { S = { ...base(), theme: S.theme, motion: S.motion, hideSecs: S.hideSecs, gate: 'welcome' }; render() }
  else if (a === 'peek') { const f = document.getElementById(t.dataset.for); const show = f.type === 'password'; f.type = show ? 'text' : 'password'; t.setAttribute('aria-pressed', show); t.setAttribute('aria-label', (show ? 'Hide' : 'Show') + ' master password'); t.innerHTML = ic(show ? 'eyeOff' : 'eye') }
  else if (a === 'ack') { S.ack = !S.ack; render() }
  else if (a === 'create') { const p = document.getElementById('mp1').value; if (p.length < 12) { S.createErr = 'Use at least 12 characters.'; render(); document.getElementById('mp1').focus(); return } S.busy = true; render() }
  else if (a === 'unlock') { const f = document.getElementById('mpu'); const v = f.value; f.value = ''; if (!v) { f.focus(); return } S.busy = true; S.gateMsg = null; render(); setTimeout(() => { S.busy = false; S.gate = 'vault'; render(); announce('Vault unlocked. 30 entries.') }, 900) }
  else if (a === 'retry') { S.gate = 'unlock'; render() }
  else if (a === 'lock') { S = { ...base(), theme: S.theme, motion: S.motion, hideSecs: S.hideSecs, gate: 'unlock' }; render(); announce('Vault locked'); document.getElementById('mpu').focus() }
  else if (a === 'folder') { hide(); S.folder = t.dataset.k; S.query = ''; S.bulk = new Set(); S.folderPanel = false; render() }
  else if (a === 'toggle') { const k = t.dataset.k; S.collapsed.has(k) ? S.collapsed.delete(k) : S.collapsed.add(k); render() }
  else if (a === 'folderpanel') { S.folderPanel = !S.folderPanel; render() }
  else if (a === 'open') openEntry(t.dataset.id)
  else if (a === 'close') { hide(); const id = S.sel; S.sel = null; S.isNew = false; S.mode = 'view'; S.sheetNotice = null; render(); const r = document.querySelector(`#row-${id} .erow__name`); if (r) r.focus() }
  else if (a === 'reveal') {
    if (S.revealed) { hide(true); return }
    S.revealed = true; S.revealAt = Date.now(); S.copyFail = false; render(); announce('Password shown')
    clearTimeout(hideTimer); hideTimer = setTimeout(() => hide(true), S.hideSecs * 1000)
  }
  else if (a === 'copy') {
    const e = byId(S.sel); const field = t.dataset.field
    const value = field === 'pw' ? SECRETS[e.id] : e.user
    try { if (S.forceCopyFail) throw new Error('blocked'); await navigator.clipboard.writeText(value); S.copied = field; S.copyFail = false; render(); announce(field === 'pw' ? 'Password copied' : 'Username copied'); setTimeout(() => { if (S.copied === field) { S.copied = null; render() } }, 2000) }
    catch { S.copyFail = true; render(); announce("Couldn't copy. Your browser blocked the clipboard.") }
  }
  else if (a === 'edit') startEdit()
  else if (a === 'replace') { S.replace = true; S.pwShown = CSS.supports('-webkit-text-security', 'disc') ? false : true; render(); document.getElementById('npw').focus() }
  else if (a === 'pwshow') { S.pwShown = !S.pwShown; render() }
  else if (a === 'gen') { S.draftPw = generate(S.gen); S.pwShown = true; render(); announce('Generated a new password. Not saved yet.') }
  else if (a === 'len') { S.gen.len = Math.max(12, Math.min(64, S.gen.len + Number(t.dataset.d))); render() }
  else if (a === 'sym') { S.gen.sym = !S.gen.sym; render() }
  else if (a === 'new') { if (t.getAttribute('aria-disabled') === 'true') return; hide(); S.sel = null; S.isNew = true; S.mode = 'edit'; S.draftPw = ''; S.pwShown = true; S.draft = { title: '', user: '', url: '', folder: S.folder.startsWith('share:') || ['all', 'none'].includes(S.folder) ? null : S.folder, notes: '' }; render(); document.getElementById('fT').focus() }
  else if (a === 'cancel') { S.mode = 'view'; S.replace = false; S.draftPw = ''; S.sheetNotice = null; S.confirmDelete = false; if (S.isNew) { S.isNew = false } render(); const h = document.getElementById('sheetT'); if (h) h.focus() }
  else if (a === 'save') { const e = byId(S.sel); if (e) { e.title = document.getElementById('fT').value || e.title; e.user = document.getElementById('fU').value; e.url = document.getElementById('fW').value; e.notes = document.getElementById('fN').value; const np = document.getElementById('npw'); if (np && np.value) SECRETS[e.id] = np.value } S.mode = 'view'; S.replace = false; S.draftPw = ''; const name = e ? e.title : 'the entry'; S.isNew = false; render(); announce(`Saved ${name}.`); const h = document.getElementById('sheetT'); if (h) h.focus() }
  else if (a === 'askdelete') { S.confirmDelete = true; render() }
  else if (a === 'keep') { S.confirmDelete = false; render() }
  else if (a === 'dodelete') { const e = byId(S.sel); S.sel = null; S.mode = 'view'; S.confirmDelete = false; render(); announce(`Deleted ${e.title}.`) }
  else if (a === 'uselatest') { S.sheetNotice = null; S.mode = 'view'; render(); announce('Loaded the latest version.') }
  else if (a === 'removeview') { S.sheetNotice = null; S.sel = null; S.mode = 'view'; render() }
  else if (a === 'pick') { const id = t.dataset.id; S.bulk.has(id) ? S.bulk.delete(id) : S.bulk.add(id); render() }
  else if (a === 'pickall') { const l = visibleEntries(); const all = l.every((e) => S.bulk.has(e.id)); l.forEach((e) => (all ? S.bulk.delete(e.id) : S.bulk.add(e.id))); render() }
  else if (a === 'clearbulk') { S.bulk = new Set(); render() }
  else if (a === 'clearq') { S.query = ''; render(); document.getElementById('q').focus() }
  else if (a === 'jump') jump(t.dataset.l)
  else if (a === 'dlg') { S.menu = null; S.dialog = t.dataset.d; render(); const x = document.querySelector('.dlg [data-f], .dlg button'); if (x) x.focus() }
  else if (a === 'dlg-x' || (a === 'dlg-x-scrim' && ev.target === t)) { S.dialog = null; S.histShown = new Set(); S.histOpen = new Set(); render() }
  else if (a === 'sharep') { S.shareDraft = t.dataset.v; render() }
  else if (a === 'notice-x') { S.notice = null; render() }
  else if (a === 'histshow') { const r = t.dataset.r; const on = !S.histShown.has(r); if (on) { S.histShown.add(r); S.histAt[r] = Date.now(); setTimeout(() => { if (S.histShown.has(r) && Date.now() - S.histAt[r] >= S.hideSecs * 1000 - 50) { S.histShown.delete(r); render(); announce('Password from this version hidden') } }, S.hideSecs * 1000) } else S.histShown.delete(r); render(); announce(on ? 'Password from this version shown' : 'Password from this version hidden'); const b = document.querySelector('[data-act="histshow"][data-r="' + r + '"]'); if (b) b.focus() }
  else if (a === 'histopen') { const r = t.dataset.r; if (S.histOpen.has(r)) { S.histOpen.delete(r); S.histShown.delete(r) } else S.histOpen.add(r); render(); const b = document.querySelector('[data-act="histopen"][data-r="' + r + '"]'); if (b) b.focus() }
})
document.addEventListener('input', (ev) => {
  const f = ev.target.dataset && ev.target.dataset.f
  if (f === 'q') { S.query = ev.target.value; hide(); render() }
  else if (f === 'npw') S.draftPw = ev.target.value
  else if (S.draft && f === 'fT') S.draft.title = ev.target.value
  else if (S.draft && f === 'fU') S.draft.user = ev.target.value
  else if (S.draft && f === 'fW') S.draft.url = ev.target.value
  else if (S.draft && f === 'fN') S.draft.notes = ev.target.value
})
document.addEventListener('keydown', (ev) => {
  if (ev.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.getElementById('q')) { ev.preventDefault(); document.getElementById('q').focus() }
  else if (ev.key === 'Escape') { if (S.dialog) { S.dialog = null; S.histShown = new Set(); S.histOpen = new Set(); render() } else if (S.menu) { S.menu = null; render() } else if (S.sel && S.mode === 'view') document.querySelector('[data-act="close"]').click() }
  else if ((ev.key === ' ' || ev.key === 'Enter') && ev.target.getAttribute('role') === 'checkbox') { ev.preventDefault(); ev.target.click() }
})
document.addEventListener('submit', (ev) => ev.preventDefault())
// Lock-boundary behavior the app must implement: hide on visibility loss.
const hideHistory = () => { if (S.histShown && S.histShown.size) { S.histShown = new Set(); render() } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { hide(false); hideHistory() } })
window.addEventListener('pagehide', () => { hide(false); hideHistory() })

/* ============ preset states (review panel) ============ */
const preset = (st) => {
  clearTimeout(hideTimer)
  unreadable.clear()
  S = { ...base(), theme: S.theme, motion: S.motion, hideSecs: S.hideSecs }
  const ex = ENTRIES.find((e) => e.title === 'Example Bank').id
  const map = {
    welcome: () => { S.gate = 'welcome' }, create: () => { S.gate = 'create' }, 'create-short': () => { S.gate = 'create'; S.createErr = 'Use at least 12 characters.' },
    unlock: () => { S.gate = 'unlock' }, unlocking: () => { S.gate = 'unlock'; S.busy = true }, wrong: () => { S.gate = 'unlock'; S.gateMsg = 'wrong' },
    'unlock-neterr': () => { S.gate = 'unlock'; S.gateMsg = 'neterr' }, metafailed: () => { S.gate = 'metafailed' }, idle: () => { S.gate = 'unlock'; S.gateMsg = 'idle' },
    vault: () => {}, entry: () => { S.sel = ex }, revealed: () => { S.sel = ex; S.revealed = true; S.revealAt = Date.now() - 9000 },
    copied: () => { S.sel = ex; S.copied = 'pw' }, copyfail: () => { S.sel = ex; S.copyFail = true; S.forceCopyFail = true },
    edit: () => { S.sel = ex; S.mode = 'edit'; const e = byId(ex); S.draft = { title: e.title, user: e.user, url: e.url, folder: e.folder, notes: e.notes } },
    replace: () => { map.edit(); S.replace = true; S.draftPw = generate(S.gen); S.pwShown = true },
    new: () => { S.isNew = true; S.mode = 'edit'; S.pwShown = true; S.draft = { title: '', user: '', url: '', folder: null, notes: '' } },
    'confirm-delete': () => { map.edit(); S.confirmDelete = true },
    conflict: () => { map.edit(); S.sheetNotice = 'conflict' }, deleted: () => { map.edit(); S.sheetNotice = 'deleted' },
    search: () => { S.query = 'bank' }, noresults: () => { S.query = 'recovery code' }, folder: () => { S.folder = 'banking' },
    shared: () => { S.folder = 'share:fam'; S.sel = ENTRIES.find((e) => e.share === 'fam').id },
    viewonly: () => { S.folder = 'share:office'; S.sel = ENTRIES.find((e) => e.share === 'office').id },
    cantopen: () => { const id = ENTRIES.find((e) => e.title === 'Garage keypad (demo)').id; unreadable.add(id); S.folder = 'home'; S.sel = id },
    bulk: () => { S.folder = 'work'; ENTRIES.filter((e) => e.folder === 'work').slice(0, 3).forEach((e) => S.bulk.add(e.id)) },
    empty: () => { S.gate = 'empty' }, offline: () => { S.notice = 'offline'; S.sel = ex }, updates: () => { S.notice = 'updates'; map.edit() },
    'dlg-share': () => { S.folder = 'home'; S.dialog = 'share' }, 'dlg-history': () => { S.sel = ex; S.dialog = 'history' }, 'dlg-activity': () => { S.dialog = 'activity' },
    'dlg-settings': () => { S.dialog = 'settings' }, 'dlg-import': () => { S.dialog = 'import' }, 'dlg-export': () => { S.dialog = 'export' }, 'dlg-move': () => { S.folder = 'banking'; S.dialog = 'move' },
    folderpanel: () => { S.folderPanel = true }, notfound: () => { S.gate = 'notfound' }
  }
  ;(map[st] || map.entry)()
  if (S.gate === 'empty') { /* rendered as the vault with the empty index */ }
  render()
  if (S.revealed) hideTimer = setTimeout(() => hide(true), S.hideSecs * 1000 - 9000)
}

/* ============ review panel ============ */
const rv = document.getElementById('review')
const sync = () => {
  document.getElementById('rvState').value = S._state || 'entry'
  document.querySelectorAll('#rvTheme button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === (S.theme === 'light' ? 'light' : 'dark')))
  document.querySelectorAll('#rvMotion button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.motion))
  document.querySelectorAll('#rvHide button').forEach((b) => b.setAttribute('aria-pressed', Number(b.dataset.v) === S.hideSecs))
}
document.getElementById('rvState').addEventListener('change', (e) => { preset(e.target.value); S._state = e.target.value; sync() })
document.getElementById('rvTheme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.theme = b.dataset.v; render(); sync() })
document.getElementById('rvMotion').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.motion = b.dataset.v; render(); sync() })
document.getElementById('rvHide').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.hideSecs = Number(b.dataset.v); render(); sync() })
document.getElementById('rvX').addEventListener('click', () => { rv.classList.toggle('collapsed'); document.getElementById('rvX').textContent = rv.classList.contains('collapsed') ? '+' : '–' })
const st0 = q.get('state') || 'entry'
preset(st0); S._state = st0; sync()
if (q.get('review') === 'hide') rv.hidden = true
if (q.get('review') === 'open') { rv.classList.remove('collapsed'); document.getElementById('rvX').textContent = '–' }
</script>
